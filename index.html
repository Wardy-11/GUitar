<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FRET//FORGE</title>
<meta name="theme-color" content="#0f1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FRET//FORGE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1114;--panel:#181b20;--line:#2a2e35;--text:#ebe8e1;--mute:#9a9ea6;--brass:#e8b13a;--live:#3ddc84;--bad:#ff6b5e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Barlow,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px}h2{font-size:22px;margin:24px 0 10px}
.logo{color:var(--brass)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.num{font-size:40px;line-height:1}.timer{font-size:84px;text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#0b0d0f;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 10px}
button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 16px;cursor:pointer}
button.go{background:var(--brass);color:#14110a;border-color:var(--brass);font-weight:600;width:100%;padding:16px;font-size:18px}
button.stop{background:var(--bad);border-color:var(--bad);color:#1a0a08;font-weight:600;width:100%;padding:16px;font-size:18px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--live);box-shadow:0 0 0 4px #3ddc8433}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0d0f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:16px 0;color:var(--mute);font-weight:600}
nav button[aria-current=true]{color:var(--brass);box-shadow:inset 0 2px var(--brass)}
.err{color:var(--bad);min-height:22px;font-size:14px}.hide{display:none}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:p 2s infinite}@keyframes p{50%{box-shadow:0 0 0 7px #3ddc8400}}}
</style></head><body>
<main id="app"></main>
<nav id="nav" class="hide">
 <button data-t="practice" aria-current="true">Practise</button><button data-t="friends">Friends</button><button data-t="board">This week</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);
const app = document.getElementById('app'), nav = document.getElementById('nav');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = s => { const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${m}m` : `${m}m`; };
const clock = s => [s/3600|0, s%3600/60|0, s%60].map(n => String(n).padStart(2,'0')).join(':');
const FOCI = ['Riffs','Alternate picking','Scales & fretboard','Songs','Theory & ear','Free practice'];
let user, tab = 'practice', active = null, tick, beat, channel;

// ---------- auth ----------
function authView(mode = 'in') {
  nav.classList.add('hide');
  app.innerHTML = `<h1><span class="logo">FRET//</span>FORGE</h1><p class="mute">Practise. Get seen practising. Keep the streak.</p>
  <form class="panel" id="f">
    ${mode==='up' ? '<label>Username<input name="u" autocomplete="username" pattern="[a-z0-9_]{3,20}" placeholder="3–20 letters, numbers, _" required></label>' : ''}
    <label>Email<input name="e" type="email" autocomplete="email" required></label>
    <label>Password<input name="p" type="password" minlength="8" autocomplete="${mode==='up'?'new':'current'}-password" required></label>
    <div class="err" id="err"></div>
    <button class="go">${mode==='up' ? 'Create account' : 'Sign in'}</button>
  </form>
  <p><button id="sw" style="width:100%">${mode==='up' ? 'I have an account' : 'New here? Create account'}</button></p>`;
  document.getElementById('sw').onclick = () => authView(mode==='up' ? 'in' : 'up');
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), err = document.getElementById('err');
    err.textContent = '';
    const r = mode==='up'
      ? await sb.auth.signUp({ email: f.get('e'), password: f.get('p'), options: { data: { username: f.get('u').toLowerCase() } } })
      : await sb.auth.signInWithPassword({ email: f.get('e'), password: f.get('p') });
    if (r.error) return err.textContent = r.error.message;
    if (mode==='up' && !r.data.session) err.textContent = 'Check your email to confirm, then sign in.';
  };
}

// ---------- data ----------
const board = async () => (await sb.rpc('leaderboard')).data || [];
async function openSession() {
  const { data } = await sb.from('sessions').select('id,focus,started_at').is('ended_at', null).limit(1);
  return data?.[0] || null;
}

// ---------- views ----------
async function practiceView() {
  const [rows, recent] = await Promise.all([board(), sb.from('sessions').select('focus,seconds,started_at,notes').not('ended_at','is',null).order('started_at',{ascending:false}).limit(8)]);
  const me = rows.find(r => r.user_id === user.id) || { week_seconds: 0, streak: 0 };
  const hist = (recent.data||[]).map(s => `<div class="item row sp"><div>${esc(s.focus)}<div class="mute">${new Date(s.started_at).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}${s.notes?' · '+esc(s.notes):''}</div></div><b>${hm(s.seconds)}</b></div>`).join('') || '<p class="mute">No sessions yet. Your first one lands here.</p>';
  app.innerHTML = active ? `
    <h1>${esc(active.focus)}</h1><div class="timer num" id="t">00:00:00</div>
    <label class="mute">Notes for this session (optional)</label><textarea id="n" rows="2" maxlength="500" placeholder="Tempo hit, what felt clean, what didn't"></textarea>
    <button class="stop" id="stop">Finish session</button>
    <p class="mute">Friends can see you're practising while this runs. Time is counted by the server.</p>`
  : `<h1>Ready when you are</h1>
    <div class="stats"><div class="panel"><div class="num">${hm(me.week_seconds)}</div><div class="mute">this week</div></div>
    <div class="panel"><div class="num">${me.streak}</div><div class="mute">day streak (5+ min counts)</div></div></div>
    <h2>Today's focus</h2><select id="focus">${FOCI.map(f=>`<option>${f}</option>`).join('')}</select>
    <button class="go" id="start">Start practising</button>
    <h2>Recent sessions</h2><div class="panel">${hist}</div>
    <p><button id="out" class="mute">Sign out (${esc(rows.find(r=>r.user_id===user.id)?.username||'')})</button></p>`;
  if (active) {
    const t = document.getElementById('t'), st = new Date(active.started_at).getTime();
    const draw = () => t.textContent = clock(Math.max(0, (Date.now() - st)/1000|0));
    draw(); clearInterval(tick); tick = setInterval(draw, 1000);
    document.getElementById('stop').onclick = async () => {
      clearInterval(tick); clearInterval(beat);
      await sb.rpc('end_session', { p_id: active.id, p_notes: document.getElementById('n').value || null });
      active = null; practiceView();
    };
  } else {
    document.getElementById('start').onclick = async () => {
      const { data, error } = await sb.rpc('start_session', { p_focus: document.getElementById('focus').value });
      if (error) return alert(error.message);
      active = await openSession(); startBeat(); practiceView();
    };
    document.getElementById('out').onclick = () => sb.auth.signOut();
  }
}
const startBeat = () => { clearInterval(beat); beat = setInterval(() => sb.rpc('heartbeat'), 60000); };

async function friendsView() {
  const [fr, rq, rows] = await Promise.all([sb.from('friendships').select('requester,addressee,status'), sb.rpc('my_requests'), board()]);
  const friends = rows.filter(r => r.user_id !== user.id);
  const pendingOut = (fr.data||[]).filter(f => f.status==='pending' && f.requester===user.id).length;
  app.innerHTML = `<h1>Friends</h1>
  <h2>Add by username</h2><form class="row" id="add"><input id="u" placeholder="username" style="margin:0" required><button>Add</button></form><div class="err" id="m"></div>
  ${(rq.data||[]).length ? `<h2>Requests</h2><div class="panel">${rq.data.map(r=>`<div class="item row sp"><b>${esc(r.username)}</b><span><button data-acc="${r.requester}">Accept</button> <button data-dec="${r.requester}">Decline</button></span></div>`).join('')}</div>` : ''}
  <h2>Practising now</h2><div class="panel">${friends.map(f=>`<div class="item row"><span class="dot ${f.live?'on':''}"></span><div><b>${esc(f.username)}</b><div class="mute">${f.live ? `${esc(f.live_focus||'Practising')} · ${hm((Date.now()-new Date(f.live_since))/1000|0)} in` : 'Not practising'}</div></div></div>`).join('') || '<p class="mute">No friends yet. Ask a bandmate for their username.</p>'}</div>
  ${pendingOut ? `<p class="mute">${pendingOut} request${pendingOut>1?'s':''} waiting on the other side.</p>` : ''}
  <label class="row mute" style="margin-top:18px"><input type="checkbox" id="share" style="width:auto;margin:0"> Let friends see when I'm practising</label>`;
  const share = document.getElementById('share');
  sb.from('profiles').select('share_live').eq('id', user.id).single().then(r => share.checked = r.data?.share_live ?? true);
  share.onchange = () => sb.from('profiles').update({ share_live: share.checked }).eq('id', user.id);
  document.getElementById('add').onsubmit = async e => {
    e.preventDefault(); const { data, error } = await sb.rpc('request_friend', { uname: document.getElementById('u').value.trim() });
    const m = document.getElementById('m'); m.textContent = error ? error.message : data === 'ok' ? 'Request sent.' : data;
  };
  app.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => { await sb.from('friendships').update({status:'accepted'}).eq('requester', b.dataset.acc).eq('addressee', user.id); friendsView(); });
  app.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => { await sb.from('friendships').delete().eq('requester', b.dataset.dec).eq('addressee', user.id); friendsView(); });
}

async function boardView() {
  const rows = await board(); const top = Math.max(1, ...rows.map(r => r.week_seconds));
  app.innerHTML = `<h1>This week</h1><p class="mute">Hours practised since Monday (UTC) and current streak. Only you and your friends are shown.</p>
  <div class="panel">${rows.map((r,i)=>`<div class="item"><div class="row sp"><span class="row"><span class="dot ${r.live?'on':''}"></span><b>${i+1}. ${esc(r.username)}${r.user_id===user.id?' (you)':''}</b></span><span><b>${hm(r.week_seconds)}</b> · ${r.streak}d streak</span></div>
  <div style="height:6px;background:var(--line);border-radius:3px;margin-top:8px"><div style="height:100%;width:${r.week_seconds/top*100}%;background:var(--brass);border-radius:3px"></div></div></div>`).join('')}</div>`;
}

// ---------- shell ----------
function render() {
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.t === tab));
  ({ practice: practiceView, friends: friendsView, board: boardView })[tab]();
}
nav.onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; render(); } };

async function boot(session) {
  user = session?.user;
  if (!user) { clearInterval(tick); clearInterval(beat); channel && sb.removeChannel(channel); return authView(); }
  nav.classList.remove('hide'); active = await openSession(); if (active) startBeat(); render();
  channel = sb.channel('live').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => { if (tab !== 'practice' || !active) render(); }).subscribe();
  setInterval(() => { if (!document.hidden && tab !== 'practice') render(); }, 30000);
}
sb.auth.onAuthStateChange((ev, s) => { if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') boot(s); });
</script></body></html>
